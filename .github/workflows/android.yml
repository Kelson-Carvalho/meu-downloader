name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Dependências
        run: |
          sudo apt update
          sudo apt install -y python3-pip build-essential git python3-dev zip unzip libffi-dev libssl-dev
          pip3 install --user --upgrade buildozer Cython virtualenv

      - name: Criar buildozer.spec e Rodar Build
        run: |
          export PATH=$PATH:$HOME/.local/bin
          
          # Criando o arquivo .spec do zero para não ter erro
          cat <<EOF > buildozer.spec
          [app]
          title = MeuDownloader
          package.name = meudownloader
          package.domain = org.test
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 0.1
          requirements = python3,kivy
          orientation = portrait
          fullscreen = 0
          android.archs = arm64-v8a, armeabi-v7a
          android.allow_backup = True
          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

          # Iniciando o build
          export BUILDOZER_ALLOW_KIVY_NEW_DESIGN=1
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meu-apk-gerado
          path: bin/*.apk
