name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Buildozer e Dependências
        run: |
          sudo apt update
          sudo apt install -y python3-pip build-essential git python3-dev zip unzip libffi-dev libssl-dev
          pip3 install --user --upgrade buildozer Cython virtualenv

      - name: Diagnóstico e Build
        run: |
          export PATH=$PATH:$HOME/.local/bin
          
          # 1. Verificar se os arquivos existem (Isso vai aparecer no seu log)
          echo "--- LISTA DE ARQUIVOS NO REPOSITÓRIO ---"
          ls -R
          
          # 2. Criar o spec se não existir
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi
          
          # 3. Rodar o build permitindo root e mostrando TUDO
          export BUILDOZER_ALLOW_KIVY_NEW_DESIGN=1
          buildozer --v android debug
