name: Build APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Buildozer
        # Esta é a Action oficial mantida pelos criadores do Kivy/Buildozer
        uses: kivy/buildozer-action@master
        with:
          command: buildozer android debug
          buildozer_version: master

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meu-aplicativo-apk
          path: bin/*.apk
