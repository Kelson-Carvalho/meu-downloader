name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Dependencias
        run: |
          sudo apt update
          sudo apt install -y build-essential git python3-dev zip unzip libffi-dev libssl-dev libltdl-dev
          pip3 install --user --upgrade buildozer Cython virtualenv

      - name: Build com Auto-Config
        run: |
          export PATH=$PATH:$HOME/.local/bin
          export BUILDOZER_ALLOW_KIVY_NEW_DESIGN=1
          export BUILDOZER_WARN_ON_ROOT=0
          
          # Resetar e criar um spec limpo e funcional
          rm -f buildozer.spec
          buildozer init
          
          # Configurações mínimas que o Android exige para não dar erro 1
          sed -i 's/^#? *title = .*/title = AppDownloader/' buildozer.spec
          sed -i 's/^#? *package.name = .*/package.name = downloaderapp/' buildozer.spec
          sed -i 's/^#? *package.domain = .*/package.domain = org.meuapp/' buildozer.spec
          sed -i 's/^#? *source.dir = .*/source.dir = ./' buildozer.spec
          sed -i 's/^#? *version = .*/version = 0.1/' buildozer.spec
          sed -i 's/^#? *requirements = .*/requirements = python3,kivy/' buildozer.spec
          
          # ACEITAR LICENÇAS ANDROID (Isso evita o Broken Pipe)
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          # Iniciar build em modo silencioso para não estourar o limite de log
          yes | buildozer android debug
        env:
          USER: root

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meu-aplicativo
          path: bin/*.apk
